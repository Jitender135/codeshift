<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Pet</title>
</head>
<body>
    <h2>Add New Pet</h2>
    <form th:action="@{/pets/new}" th:object="${pet}" method="post">
        <label>Name:</label>
        <input type="text" th:field="*{name}" />
        <label>Species:</label>
        <input type="text" th:field="*{species}" />
        <label>Age:</label>
        <input type="number" th:field="*{age}" />
        <button type="submit">Save</button>
    </form>
</body>
</html>
